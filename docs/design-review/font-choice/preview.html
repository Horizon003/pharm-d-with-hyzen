<h1>Find your type.</h1><p class="intro">Pharm D with Hyzen · Three real fonts, identical sizes and layout · Reference-inspired concept with sample data</p>

<script>
const icons={search:'<circle cx="10.5" cy="10.5" r="6.8"/><path d="m16 16 5 5"/>',home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',book:'<path d="M12 5c-3-3-6-3-9-2v16c3-1 6-1 9 2 3-3 6-3 9-2V3c-3-1-6-1-9 2v16"/>',office:'<rect x="4" y="3" width="16" height="14" rx="2"/><path d="m4 17-2 4h20l-2-4"/>',shop:'<rect x="4" y="7" width="16" height="14" rx="2"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',arrow:'<path d="m9 5 7 7-7 7"/>'};const svg=n=>`<svg viewBox="0 0 24 24">${icons[n]}</svg>`;
const choices=[['1 · Outfit','Closest to your reference · rounded & relaxed','Outfit'],['2 · Sora','Sharper character · clean geometric forms','Sora'],['3 · Plus Jakarta Sans','Balanced & polished · compact reading','Jakarta']];
for(const [name,note,font] of choices){const el=document.createElement('section');el.style.setProperty('--font',font);el.innerHTML=`<div class="choice">${name}<small>${note}</small></div><div class="phone"><div class="top"><img class="avatar" src="../../../hyzen_flutter/assets/mascot/mascot_studying.png"><div class="greet"><b>Hello, Haris</b><div>Today 25 Nov.</div></div><button class="circle">${svg('search')}</button></div><div class="hero"><img class="hero-art" src="../../../hyzen_flutter/assets/reference/focus-shapes.png"><h2>Daily<br>challenge</h2><p>A little focus goes a long way.</p><button class="pill">Start focus</button></div><div class="dates">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<div class="date ${i===3?'selected':i===1?'mark':''}"><span>${d}</span>${22+i}</div>`).join('')}</div><h2 class="section">Your plan</h2><div class="plan"><div class="goal"><div class="tag">Daily goal</div><h3>Study session</h3><p>25 Nov.</p><p>45 / 120 min</p><button class="pill">View goal</button></div><div class="side"><div class="office"><span class="tag">Workspace</span><h3>Your office</h3><p>Scan, edit<br>and organise</p><img src="../../../hyzen_flutter/assets/reference/office-kit.png"></div><div class="mcq">Practice MCQs ${svg('arrow')}</div></div></div><div class="nav"><div class="active">${svg('home')} Home</div><div>${svg('book')}</div><div>${svg('office')}</div><div>${svg('shop')}</div><div>${svg('download')}</div></div></div><div class="specimen"><strong>Aa Gg 012345</strong>Make room for focus.<br>Small buttons. A calmer study day.</div>`;document.querySelector('#grid').appendChild(el);}
</script></html>
