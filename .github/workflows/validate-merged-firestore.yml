name: Validate merged production Firestore rules
on:
  push:
    branches: [feat/onesignal-global-professional]
    paths:
      - 'backend/firestore.production.merged.rules'
      - 'backend/tests/merged-production-rules.cjs'
      - '.github/workflows/validate-merged-firestore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merged-firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator and test dependencies
        run: |
          npm install --no-save --no-package-lock firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Run merged rules security tests (NO PRODUCTION DEPLOY)
        run: npx firebase emulators:exec --config backend/firebase.json --only firestore --project hyzen-rules-ci "node backend/tests/merged-production-rules.cjs"
