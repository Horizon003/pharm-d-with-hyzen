name: Hyzen design and avatar review checks
on:
  pull_request:
    branches: [main]
    paths: [updates_phase_01.json, updates_phase_02.json, updates_phase_03.json, updates_phase_04.json, updates_phase_05.json, updates_camera.json, updates_phase_06.json, updates_phase_07.json, updates_phase_08.json, phase02_assets/**, tools/assemble_review.py, .github/workflows/phase01-check.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hyzen-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assemble current application with verified source manifest
        run: python3 tools/assemble_review.py --repo . --output hyzen_flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: hyzen_flutter
      - name: Normalize inherited source as in baseline build
        working-directory: hyzen_flutter
        run: |
          dart format lib test
          dart fix --apply
          dart fix --apply --code=curly_braces_in_flow_control_structures
          dart format lib test
      - run: flutter analyze --no-pub
        working-directory: hyzen_flutter
      - name: Unit and widget regression suite
        working-directory: hyzen_flutter
        run: flutter test --no-pub --reporter expanded
      - name: Capture review screens (not a golden comparison)
        working-directory: hyzen_flutter
        run: flutter test test/navigation_test.dart test/symbol_state_test.dart test/scan_corners_test.dart test/scan_pdf_test.dart test/studio_annotation_test.dart --no-pub --dart-define=HYZEN_CAPTURE_QA=true --update-goldens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyzen-phase01-review
          path: |
            hyzen_flutter/qa/*.png
            hyzen_flutter/pubspec.lock
          if-no-files-found: warn
  native-review:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Reserve disk for Android emulator on disposable runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Assemble the same review overlays for native debug tests
        run: python3 tools/assemble_review.py --repo . --output hyzen_flutter --debug-tests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore verified Gradle dependencies with migration fallback
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.gradle/caches
            /home/runner/.gradle/wrapper
          key: hyzen-native-gradle-${{ runner.os }}-${{ hashFiles('hyzen_flutter/android/**/*.gradle.kts', 'hyzen_flutter/android/gradle/wrapper/gradle-wrapper.properties', 'hyzen_flutter/pubspec.yaml') }}
          restore-keys: |
            hyzen-native-gradle-${{ runner.os }}-
            setup-java-Linux-x64-gradle-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Prepare only development signing for the fresh emulator
        working-directory: hyzen_flutter
        run: |
          mkdir -p android/test-signing
          if [ ! -f android/test-signing/hyzen-test.keystore ]; then
            keytool -genkeypair -noprompt -storetype JKS -keystore android/test-signing/hyzen-test.keystore -alias AndroidDebugKey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname 'CN=Hyzen emulator review'
          fi
          chmod +x android/gradlew
      - run: flutter pub get
        working-directory: hyzen_flutter
      - name: Inspect scanner future API dependency
        working-directory: hyzen_flutter/android
        run: |
          python3 - <<'PYSDK'
          import os
          from pathlib import Path
          android_sdk = os.environ.get('ANDROID_HOME') or os.environ.get('ANDROID_SDK_ROOT')
          assert android_sdk and os.environ.get('FLUTTER_ROOT')
          Path('local.properties').write_text('sdk.dir=' + android_sdk + '\nflutter.sdk=' + os.environ['FLUTTER_ROOT'] + '\n')
          PYSDK
          ./gradlew :app:dependencyInsight --configuration debugCompileClasspath --dependency listenablefuture --no-daemon
      - name: Build review debug application and native tests
        working-directory: hyzen_flutter
        run: |
          flutter build apk --debug --target-platform android-x64 --no-pub
          cd android
          ./gradlew :app:assembleDebugAndroidTest --no-daemon
      - name: Release native build tools before emulator installation
        working-directory: hyzen_flutter/android
        run: |
          ./gradlew --stop
          rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          df -h /
      - name: Verify emulator disk headroom
        run: |
          df -h /
          python3 -c "import shutil; free=shutil.disk_usage('/').free; print(f'Free bytes before emulator: {free}'); assert free >= 12 * 1024**3, 'Need 12 GiB for emulator image and minimum userdata'"
      - name: Enable emulator KVM (same setup as existing verification)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: |
            adb install -r hyzen_flutter/build/app/outputs/flutter-apk/app-debug.apk
            adb install -r -t hyzen_flutter/build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.hyzen.pharmd.test/androidx.test.runner.AndroidJUnitRunner | tee native-review-tests.txt
            adb exec-out run-as com.hyzen.pharmd cat cache/qa_camera_metrics.json > native-camera-metrics.json || true
            adb exec-out run-as com.hyzen.pharmd cat cache/qa_live_camera_portrait.png > native-live-camera-portrait.png || true
            adb exec-out run-as com.hyzen.pharmd cat cache/qa_live_camera.png > native-live-camera.png || true
            python3 -c "from pathlib import Path; s=Path('native-review-tests.txt').read_text(); assert 'OK (' in s and 'FAILURES' not in s, s"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyzen-native-review-evidence
          path: |
            native-review-tests.txt
            native-live-camera.png
            native-live-camera-portrait.png
            native-camera-metrics.json
            hyzen_flutter/build/app/reports/androidTests/
          if-no-files-found: warn

