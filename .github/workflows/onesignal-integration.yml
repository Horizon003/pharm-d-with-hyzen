name: OneSignal and professional rank verification
on:
  workflow_dispatch:
  push:
    branches: [feat/onesignal-global-professional]
  pull_request:
    branches: [main]
    paths: ['push-worker/**', 'hyzen_flutter/**']
permissions:
  contents: read
env:
  PUSH_API_BASE: ${{ vars.HYZEN_PUSH_API_BASE }}
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ONESIGNAL_DISABLE_LOCATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Require the configured production backend URL
        run: python tools/ci/validate_push_url.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true
      - run: flutter pub get
        working-directory: hyzen_flutter
      - run: flutter analyze --no-pub
        working-directory: hyzen_flutter
      - run: flutter test --no-pub -r expanded
        working-directory: hyzen_flutter
      - run: flutter build web --release --no-pub --base-href /pharm-d-with-hyzen/ --dart-define=PUSH_API_BASE="$PUSH_API_BASE"
        working-directory: hyzen_flutter
      - name: Stage verified Gradle runtime through official release API
        run: python tools/ci/prepare_gradle.py
      - name: Build Android debug APK (retry transient dependency downloads once)
        run: |
          flutter build apk --debug --no-pub --dart-define=PUSH_API_BASE="$PUSH_API_BASE" ||
            flutter build apk --debug --no-pub --dart-define=PUSH_API_BASE="$PUSH_API_BASE"
        working-directory: hyzen_flutter
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onesignal-review-builds
          path: |
            hyzen_flutter/build/web
            hyzen_flutter/build/app/outputs/flutter-apk/app-debug.apk
  sender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: push-worker
      - run: npm test
        working-directory: push-worker
      - run: npx wrangler deploy --dry-run --outdir dist
        working-directory: push-worker
      - run: node --test backend/functions/scoring.test.js
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
        working-directory: backend/functions
      - run: functions/node_modules/.bin/firebase emulators:exec --project demo-hyzen-study --only firestore "cd functions && npm run test:rules"
        working-directory: backend
  owner-signed-apk:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [flutter, sender, rules]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ONESIGNAL_DISABLE_LOCATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Require the configured production backend URL
        run: python tools/ci/validate_push_url.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true
      - name: Restore existing owner signing only
        working-directory: hyzen_flutter
        env:
          KEYSTORE_BASE64: ${{ secrets.HYZEN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HYZEN_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.HYZEN_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HYZEN_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          mkdir -p android/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/signing/hyzen-release.jks
          printf 'storeFile=signing/hyzen-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          chmod 600 android/signing/hyzen-release.jks android/key.properties
      - run: flutter pub get
        working-directory: hyzen_flutter
      - name: Build owner-signed release APK (retry transient dependency downloads once)
        # Stage the exact official runtime before using Flutter's wrapper.
        # The pin prevents alternate or partial download bytes from being used.
        run: |
          python tools/ci/prepare_gradle.py
          cd hyzen_flutter
          flutter build apk --release --no-pub --dart-define=PUSH_API_BASE="$PUSH_API_BASE" ||
            flutter build apk --release --no-pub --dart-define=PUSH_API_BASE="$PUSH_API_BASE"
      - name: Verify existing owner certificate
        working-directory: hyzen_flutter
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --print-certs build/app/outputs/flutter-apk/app-release.apk > signing-report.txt
          grep -qi '3fd902d131ae56d8de4792c9f5953759e2b375e32bcad8f57f7ef5c0ab887f83' signing-report.txt
          printf 'Source commit: %s\nPush API: %s\n' "$GITHUB_SHA" "${PUSH_API_BASE:-NOT CONFIGURED}" > build-provenance.txt
          sha256sum build/app/outputs/flutter-apk/app-release.apk > apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hyzen-onesignal-owner-signed-apk
          path: |
            hyzen_flutter/build/app/outputs/flutter-apk/app-release.apk
            hyzen_flutter/signing-report.txt
            hyzen_flutter/build-provenance.txt
            hyzen_flutter/apk-sha256.txt
      - name: Remove restored signing files
        if: always()
        run: rm -f hyzen_flutter/android/key.properties hyzen_flutter/android/signing/hyzen-release.jks
  android-launch:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: owner-signed-apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hyzen-onesignal-owner-signed-apk
          path: verified-apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r "$(find verified-apk -name app-release.apk -print -quit)"
            adb shell pm grant com.hyzen.pharmd android.permission.POST_NOTIFICATIONS
            adb logcat -c
            adb shell monkey -p com.hyzen.pharmd -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof com.hyzen.pharmd
            adb logcat -d > android-startup.log
            adb exec-out screencap -p > android-startup.png
            ! grep -E 'FATAL EXCEPTION|E/flutter.*Unhandled Exception|Fatal signal' android-startup.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyzen-android-startup-evidence
          path: |
            android-startup.log
            android-startup.png
          if-no-files-found: ignore
