name: Deploy Hyzen web preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/web-preview.yml'
      - 'hyzen_flutter/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUSH_API_BASE: ${{ vars.HYZEN_PUSH_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the configured production backend URL
        run: python tools/ci/validate_push_url.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: hyzen_flutter
      - name: Build browser preview
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          flutter build web --release --no-pub --base-href "/pharm-d-with-hyzen/" --dart-define=HYZEN_APP_VERSION="$version" --dart-define=PUSH_API_BASE="$PUSH_API_BASE"
        working-directory: hyzen_flutter
      - name: Add SPA fallback
        run: cp hyzen_flutter/build/web/index.html hyzen_flutter/build/web/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hyzen_flutter/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

