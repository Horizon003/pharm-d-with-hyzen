name: Build signed Hyzen APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUSH_API_BASE: ${{ vars.HYZEN_PUSH_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: hyzen_flutter/android/*.gradle*
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Restore owner signing key
        working-directory: hyzen_flutter
        env:
          KEYSTORE_BASE64: ${{ secrets.HYZEN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HYZEN_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.HYZEN_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HYZEN_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          mkdir -p android/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/signing/hyzen-release.jks
          chmod 600 android/signing/hyzen-release.jks
          printf 'storeFile=signing/hyzen-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          chmod 600 android/key.properties
      - run: flutter pub get
        working-directory: hyzen_flutter
      - name: Patch pdfrx PDFium downloader for transient release failures
        run: python tools/ci/patch_pdfrx_download.py
      - run: flutter analyze --no-pub
        working-directory: hyzen_flutter
      - run: flutter test --no-pub --reporter expanded
        working-directory: hyzen_flutter
      - name: Require the configured production backend URL
        run: test -n "$PUSH_API_BASE"
      - name: Stage verified Gradle runtime
        run: python tools/ci/prepare_gradle.py
      - name: Build signed release APK (retry native dependency downloads once)
        run: |
          flutter build apk --release --no-pub --no-shrink --dart-define=PUSH_API_BASE="$PUSH_API_BASE" ||
            flutter build apk --release --no-pub --no-shrink --dart-define=PUSH_API_BASE="$PUSH_API_BASE"
        working-directory: hyzen_flutter
      - name: Identify artifact
        run: sha256sum hyzen_flutter/build/app/outputs/flutter-apk/app-release.apk > hyzen_flutter/build/app/outputs/flutter-apk/app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PharmD_With_Hyzen_1.5.3_signed
          path: |
            hyzen_flutter/build/app/outputs/flutter-apk/app-release.apk
            hyzen_flutter/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

  install-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PharmD_With_Hyzen_1.5.3_signed
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r apk/app-release.apk
            adb shell monkey -p com.hyzen.pharmd -c android.intent.category.LAUNCHER 1
            sleep 8
            adb logcat -d > launch-logcat.txt
            adb shell pidof com.hyzen.pharmd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hyzen_install_smoke_logs
          path: launch-logcat.txt
          if-no-files-found: ignore
