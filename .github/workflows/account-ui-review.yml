name: Deploy interactive Flutter UI preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: hyzen_flutter
      - run: flutter analyze --no-pub
        working-directory: hyzen_flutter
      - run: flutter test --no-pub --reporter expanded
        working-directory: hyzen_flutter
      - name: Build real Flutter sample-data preview
        run: bash tools/live_preview/build.sh
        env:
          HYZEN_PREVIEW_BASE_HREF: /pharm-d-with-hyzen/
      - name: Verify deploy paths
        run: |
          test -s hyzen_flutter/build/live-preview/index.html
          test -s hyzen_flutter/build/live-preview/app/main.dart.js
          test -s hyzen_flutter/build/live-preview/source-commit.txt
          python3 -c "from pathlib import Path; assert '<base href=\"/pharm-d-with-hyzen/app/\">' in Path('hyzen_flutter/build/live-preview/app/index.html').read_text()"
      - uses: actions/upload-artifact@v4
        with:
          name: interactive-flutter-preview-${{ github.sha }}
          path: hyzen_flutter/build/live-preview/
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hyzen_flutter/build/live-preview/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
