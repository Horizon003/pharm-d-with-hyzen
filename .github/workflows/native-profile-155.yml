name: Native Flutter 1.5.11 profile verification
on:
  workflow_dispatch:
  push:
    branches: [work/monochrome-motion-1.5.5]
    paths: ['.github/workflows/native-profile-155.yml']
permissions:
  contents: read
concurrency:
  group: native-profile-reference
  cancel-in-progress: true
jobs:
  native-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PDFIUM_MIRROR_DIR: ${{ github.workspace }}/tools/ci/pdfium
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc /usr/share/swift
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true
      - run: flutter pub get
        working-directory: hyzen_flutter
      - run: python tools/ci/patch_pdfrx_download.py
      - run: python tools/ci/prepare_gradle.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          working-directory: hyzen_flutter
          script: bash -o pipefail -c 'flutter drive --profile --no-dds --driver=test_driver/monochrome_profile.dart --target=integration_test/monochrome_profile_test.dart --dart-define=HYZEN_REVIEW_ROUTE=/home 2>&1 | tee /tmp/hyzen-native-profile.log'
      - name: Surface profile failure before log cleanup
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('/tmp/hyzen-native-profile.log')
          text=path.read_text()[-16000:] if path.exists() else 'Profile command did not start; inspect emulator bootstrap.'
          for i in range(0,len(text),3000):
              print('::notice title=Profile diagnostic '+str(i//3000+1)+'::'+text[i:i+3000].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
      - name: Require complete nonempty profile measurements
        working-directory: hyzen_flutter
        run: python ../tools/ci/stage_profile_evidence.py qa/reference/native build/verified-profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-native-profile
          path: |
            hyzen_flutter/qa/reference/native/
            hyzen_flutter/build/integration_response_data.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-only-profile-apk
          path: hyzen_flutter/build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: ignore
